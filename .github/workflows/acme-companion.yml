name: acme-companion

# Builds, smoke-tests, scans and publishes ghcr.io/<owner>/hardened-acme-companion
# through the reusable build-scan-publish.yml. See images/acme-companion/README.md.

on:
  push:
    branches: [ main ]
    paths:
      - 'images/acme-companion/**'
      - 'images/nginx-proxy/tools/**'
      - '.github/workflows/acme-companion.yml'
      - '.github/workflows/build-scan-publish.yml'
  pull_request:
    paths:
      - 'images/acme-companion/**'
      - 'images/nginx-proxy/tools/**'
      - '.github/workflows/acme-companion.yml'
      - '.github/workflows/build-scan-publish.yml'
  schedule:
    - cron: '0 3 * * *'  # nightly: picks up base-image and package fixes
  workflow_dispatch:

permissions: {}

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-scan-publish.yml
    with:
      image-name: hardened-acme-companion
      context: images
      dockerfile: images/acme-companion/Dockerfile
      smoke-test: images/acme-companion/smoke-test.sh
      trivyignore: images/acme-companion/.trivyignore
      dhi-login: true
      extra-tags: '2.8.2'
    secrets:
      dhi-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dhi-token: ${{ secrets.DOCKERHUB_TOKEN }}
      discord-webhook: ${{ secrets.ALERTS_DISCORD_WEBHOOK }}
