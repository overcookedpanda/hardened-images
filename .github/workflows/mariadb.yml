name: mariadb

# Builds, smoke-tests, scans and publishes ghcr.io/<owner>/hardened-mariadb
# through the reusable build-scan-publish.yml. See images/mariadb/README.md.

on:
  push:
    branches: [ main ]
    paths:
      - 'images/mariadb/**'
      - '.github/workflows/mariadb.yml'
      - '.github/workflows/build-scan-publish.yml'
  pull_request:
    paths:
      - 'images/mariadb/**'
      - '.github/workflows/mariadb.yml'
      - '.github/workflows/build-scan-publish.yml'
  schedule:
    - cron: '0 2 * * *'  # nightly: picks up base-image and package fixes
  workflow_dispatch:

permissions: {}

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-scan-publish.yml
    with:
      image-name: hardened-mariadb
      context: images/mariadb
      dockerfile: images/mariadb/Dockerfile
      smoke-test: images/mariadb/smoke-test.sh
      dhi-login: false
      gate-library-severity: CRITICAL,HIGH,MEDIUM
      extra-tags: '12.3'
    secrets:
      dhi-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dhi-token: ${{ secrets.DOCKERHUB_TOKEN }}
      discord-webhook: ${{ secrets.ALERTS_DISCORD_WEBHOOK }}
