# /etc/nginx/nginx.conf for the hardened nginx-proxy.
#
# The official nginx image's nginx.conf with nginx-proxy 1.11.6's edits
# (worker_connections 10240, worker_rlimit_nofile 20480, the toplevel.conf.d
# include), because docker-gen's nginx.tmpl is written against that file: it
# adds its own http-level maps, log format and SSL settings in conf.d, which
# the Alpine-style nginx.conf the hardened base ships would duplicate.
#
# The master runs as root (see the Dockerfile); workers drop to the
# unprivileged nginx user (uid 65532 in the hardened base).
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx/nginx.pid;

events {
    worker_connections   10240;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
worker_rlimit_nofile 20480;

include /etc/nginx/toplevel.conf.d/*.conf;
